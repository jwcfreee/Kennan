<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Kennan Egloria | Operations Manager & Creative Specialist</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --coral:#f87171;--violet:#a78bfa;--teal:#2dd4bf;--yellow:#fbbf24;--green:#4ade80;
  --bg:#060610;--bg2:#0a0a1a;--bg3:#0f0f24;--card:#0d0d20;
  --border:#1a1a32;--border2:#28284a;--text:#eeeeff;--muted:#6a6a90;--dim:#252542;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--violet);border-radius:99px;}

/* SCROLL ANIMATIONS */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease);}
.reveal.visible{opacity:1;transform:translateY(0);}
.reveal-left{opacity:0;transform:translateX(-32px);transition:opacity .9s var(--ease),transform .9s var(--ease);}
.reveal-left.visible{opacity:1;transform:translateX(0);}
.reveal-right{opacity:0;transform:translateX(32px);transition:opacity .9s var(--ease),transform .9s var(--ease);}
.reveal-right.visible{opacity:1;transform:translateX(0);}
.d1{transition-delay:.06s;}.d2{transition-delay:.13s;}.d3{transition-delay:.20s;}.d4{transition-delay:.27s;}
.d5{transition-delay:.34s;}.d6{transition-delay:.41s;}.d7{transition-delay:.48s;}.d8{transition-delay:.55s;}

/* NAV */
nav{position:fixed;top:0;width:100%;background:rgba(6,6,16,.9);backdrop-filter:blur(24px);z-index:999;padding:16px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);}
.logo{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:.95rem;color:var(--teal);}
.logo span{color:var(--muted);}
.nav-links{display:flex;align-items:center;gap:2px;}
.nav-links a{text-decoration:none;color:var(--muted);font-weight:500;font-size:.74rem;letter-spacing:.5px;text-transform:uppercase;padding:7px 14px;border-radius:6px;border:1px solid transparent;transition:.2s;}
.nav-links a:hover{color:var(--violet);background:rgba(167,139,250,.06);border-color:rgba(167,139,250,.14);}
.nav-divider{color:var(--dim);font-size:.6rem;padding:0 2px;}

/* HERO */
#hero{min-height:100vh;display:flex;align-items:center;padding:130px 6% 90px;position:relative;overflow:hidden;}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(167,139,250,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(167,139,250,.03) 1px,transparent 1px);background-size:64px 64px;}
.radial{position:absolute;inset:0;background:radial-gradient(ellipse 50% 70% at 30% 50%,rgba(167,139,250,.06) 0%,transparent 70%);}
.blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.09;animation:drift 10s ease-in-out infinite;}
.blob1{width:700px;height:700px;background:var(--violet);top:-250px;left:-200px;}
.blob2{width:500px;height:500px;background:var(--coral);bottom:-200px;right:-100px;animation-delay:4s;}
@keyframes drift{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-24px) scale(1.03);}}

.hero-inner{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;max-width:1200px;width:100%;}
.hero-left{}
.hero-tag{display:inline-flex;align-items:center;gap:8px;background:rgba(45,212,191,.07);border:1px solid rgba(45,212,191,.18);color:var(--teal);font-size:.65rem;font-weight:600;padding:6px 16px;border-radius:4px;margin-bottom:28px;letter-spacing:1.2px;font-family:'JetBrains Mono',monospace;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 2.2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.3;transform:scale(.75);}}
.hero-name{font-size:clamp(2.8rem,5vw,4.8rem);font-weight:900;line-height:1.05;letter-spacing:-2px;margin-bottom:14px;}
.hero-name .grad{background:linear-gradient(135deg,#fff 0%,rgba(167,139,250,.9) 60%,var(--teal) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero-roles{display:flex;flex-direction:column;gap:6px;margin-bottom:24px;}
.role-pill{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;color:var(--muted);}
.role-pill .rp-dot{width:4px;height:4px;border-radius:50%;}
.rp1{background:var(--violet);}.rp2{background:var(--coral);}.rp3{background:var(--teal);}.rp4{background:var(--yellow);}
.hero-sub{font-size:.9rem;color:var(--muted);line-height:1.9;max-width:480px;margin-bottom:40px;}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap;}
.btn{padding:12px 28px;border-radius:7px;font-weight:600;font-size:.83rem;cursor:pointer;border:none;transition:.25s;text-decoration:none;display:inline-block;font-family:'Inter',sans-serif;letter-spacing:.3px;}
.btn-primary{background:var(--violet);color:#06060f;box-shadow:0 0 28px rgba(167,139,250,.2);}
.btn-primary:hover{background:#baaafb;transform:translateY(-3px);box-shadow:0 0 40px rgba(167,139,250,.36);}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text);}
.btn-outline:hover{border-color:var(--violet);color:var(--violet);transform:translateY(-3px);}

/* Hero right - stat cards */
.hero-right{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.h-stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;transition:.3s;}
.h-stat:hover{border-color:var(--border2);transform:translateY(-4px);}
.h-stat .hs-icon{font-size:1.6rem;margin-bottom:10px;}
.h-stat .hs-num{font-size:1.8rem;font-weight:900;font-family:'JetBrains Mono',monospace;background:linear-gradient(135deg,var(--violet),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;}
.h-stat .hs-lbl{font-size:.7rem;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;}
.h-stat .hs-sub{font-size:.65rem;color:var(--dim);margin-top:3px;}

/* SECTIONS */
section{padding:120px 6%;}
.sec-label{font-size:.6rem;font-weight:700;letter-spacing:3.5px;text-transform:uppercase;color:var(--teal);margin-bottom:10px;font-family:'JetBrains Mono',monospace;}
.sec-title{font-size:clamp(2rem,4vw,3rem);font-weight:900;margin-bottom:16px;letter-spacing:-1.5px;}
.sec-title span{background:linear-gradient(135deg,var(--violet),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sec-desc{font-size:.88rem;color:var(--muted);line-height:1.9;max-width:560px;margin-bottom:60px;}

/* ABOUT */
#about{background:var(--bg2);}
.about-grid{display:grid;grid-template-columns:300px 1fr;gap:64px;align-items:start;}
.about-photo-col{}
.about-photo-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px;text-align:center;position:sticky;top:100px;}
.photo-wrap{position:relative;width:150px;height:150px;margin:0 auto 18px;}
.photo-wrap::before{content:'';position:absolute;inset:-3px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--violet),var(--teal));z-index:0;animation:spin 7s linear infinite;}
@keyframes spin{0%{filter:hue-rotate(0deg);}100%{filter:hue-rotate(360deg);}}
.photo-wrap img{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center top;border:3px solid var(--card);}
.apc-name{font-size:.95rem;font-weight:800;color:var(--text);margin-bottom:3px;}
.apc-role{font-size:.65rem;color:var(--teal);font-family:'JetBrains Mono',monospace;letter-spacing:.5px;margin-bottom:14px;}
.apc-tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.tag{background:rgba(167,139,250,.07);border:1px solid rgba(167,139,250,.14);color:var(--violet);border-radius:4px;padding:3px 10px;font-size:.63rem;font-weight:600;font-family:'JetBrains Mono',monospace;}
.divider{width:100%;height:1px;background:var(--border);margin:16px 0;}
.apc-contacts{display:flex;flex-direction:column;gap:8px;}
.apc-contact{display:flex;align-items:center;gap:8px;text-decoration:none;font-size:.72rem;color:var(--muted);font-weight:500;transition:.2s;}
.apc-contact:hover{color:var(--violet);}
.apc-contact .cc{font-size:.85rem;}

.about-content{}
.quote{border-left:2px solid var(--violet);padding:18px 22px;background:rgba(167,139,250,.04);border-radius:0 12px 12px 0;color:var(--text);font-style:italic;font-size:.92rem;line-height:1.85;margin-bottom:32px;}
.about-content p{color:var(--muted);line-height:1.95;font-size:.88rem;margin-bottom:14px;}
.info-rows{display:flex;flex-direction:column;gap:10px;margin-top:24px;}
.info-row{display:flex;align-items:center;gap:12px;font-size:.82rem;color:var(--text);}
.info-row .ico{width:30px;height:30px;border-radius:7px;background:rgba(167,139,250,.09);display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0;}

/* SERVICES */
#services{background:var(--bg);}
.services-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;}
.svc-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;transition:transform .35s var(--ease),border-color .3s,box-shadow .35s var(--ease);position:relative;overflow:hidden;cursor:default;}
.svc-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--violet),var(--teal));opacity:0;transition:.3s;}
.svc-card:hover{transform:translateY(-8px);border-color:var(--border2);box-shadow:0 28px 64px rgba(0,0,0,.5);}
.svc-card:hover::after{opacity:1;}
.svc-icon{font-size:2.2rem;margin-bottom:18px;}
.svc-card h4{font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:10px;}
.svc-card p{font-size:.8rem;color:var(--muted);line-height:1.8;}
.svc-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px;}
.svc-tag{background:rgba(45,212,191,.06);border:1px solid rgba(45,212,191,.12);color:var(--teal);font-size:.62rem;font-weight:600;padding:2px 9px;border-radius:4px;font-family:'JetBrains Mono',monospace;}

/* PROJECTS */
#projects{background:var(--bg2);}
/* Featured large project */
.proj-featured{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-bottom:28px;}
.proj-card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:transform .35s var(--ease),border-color .3s,box-shadow .35s var(--ease);}
.proj-card:hover{transform:translateY(-6px);border-color:rgba(167,139,250,.3);box-shadow:0 24px 56px rgba(0,0,0,.5);}
.proj-card.large{grid-column:span 2;}

/* BREVEA SLIDER */
.brevea-card{padding:0;overflow:hidden;}
.brevea-layout{display:grid;grid-template-columns:auto 1fr;align-items:start;}
.brevea-slider-wrap{position:relative;background:#000;flex-shrink:0;width:360px;}
.brevea-badge{position:absolute;top:14px;left:14px;z-index:10;background:rgba(10,10,26,.85);border:1px solid var(--border2);color:var(--violet);font-size:.58rem;font-weight:700;padding:4px 10px;border-radius:4px;letter-spacing:.8px;font-family:'JetBrains Mono',monospace;backdrop-filter:blur(8px);}
.brevea-slider{width:360px;overflow:hidden;aspect-ratio:4/5;position:relative;}
.brevea-slide{position:absolute;inset:0;opacity:0;transition:opacity .5s var(--ease);display:flex;align-items:center;justify-content:center;background:#111;}
.brevea-slide.active{opacity:1;position:relative;}
.brevea-slide img{width:100%;height:100%;object-fit:contain;display:block;}
.slide-fb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%;color:var(--muted);font-size:3rem;}
.slide-fb span{font-size:.7rem;font-family:'JetBrains Mono',monospace;color:var(--dim);}
.sl-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(10,10,26,.75);border:1px solid var(--border2);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:1.3rem;cursor:pointer;z-index:10;backdrop-filter:blur(8px);transition:.2s;display:flex;align-items:center;justify-content:center;line-height:1;}
.sl-btn:hover{background:var(--violet);color:#06060f;border-color:var(--violet);}
.sl-prev{left:10px;}.sl-next{right:10px;}
.sl-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10;}
.sl-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:.3s;}
.sl-dot.active{background:var(--violet);width:18px;border-radius:4px;}
.sl-counter{position:absolute;bottom:10px;right:12px;font-size:.6rem;font-family:'JetBrains Mono',monospace;color:rgba(255,255,255,.5);z-index:10;}
.brevea-info{padding:32px 28px;display:flex;flex-direction:column;justify-content:center;}
.brevea-info h4{font-size:1.1rem;font-weight:800;color:var(--text);margin:6px 0 12px;letter-spacing:-.3px;}
.brevea-info p{font-size:.82rem;color:var(--muted);line-height:1.85;margin-bottom:24px;}
.brevea-slides-list{display:flex;flex-direction:column;gap:6px;}
.bsl-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:.25s;}
.bsl-item:hover,.bsl-item.active{border-color:var(--violet);background:rgba(167,139,250,.06);}
.bsl-num{font-size:.62rem;font-family:'JetBrains Mono',monospace;color:var(--violet);font-weight:600;width:20px;flex-shrink:0;}
.bsl-lbl{font-size:.78rem;font-weight:600;color:var(--muted);}
.bsl-item.active .bsl-lbl{color:var(--text);}
@media(max-width:900px){
  .brevea-layout{grid-template-columns:1fr;}
  .brevea-slider-wrap,.brevea-slider{width:100%;}
}
.proj-thumb{height:220px;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;overflow:hidden;}
.proj-thumb img{width:100%;height:100%;object-fit:cover;transition:.4s;}
.proj-card:hover .proj-thumb img{transform:scale(1.04);}
.proj-thumb-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3rem;}
.pt1{background:linear-gradient(135deg,rgba(45,212,191,.15),rgba(167,139,250,.08));}
.pt2{background:linear-gradient(135deg,rgba(248,113,113,.15),rgba(251,191,36,.08));}
.pt3{background:linear-gradient(135deg,rgba(167,139,250,.15),rgba(248,113,113,.08));}
.pt4{background:linear-gradient(135deg,rgba(74,222,128,.15),rgba(45,212,191,.08));}
.pt5{background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(74,222,128,.08));}
.proj-badge{position:absolute;top:14px;right:14px;background:rgba(10,10,26,.8);border:1px solid var(--border2);color:var(--violet);font-size:.58rem;font-weight:700;padding:4px 10px;border-radius:4px;letter-spacing:.8px;font-family:'JetBrains Mono',monospace;backdrop-filter:blur(8px);}
.proj-body{padding:24px;}
.proj-client{font-size:.6rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--teal);margin-bottom:5px;font-family:'JetBrains Mono',monospace;}
.proj-body h4{font-size:.98rem;font-weight:700;margin-bottom:8px;color:var(--text);}
.proj-body p{font-size:.78rem;color:var(--muted);line-height:1.8;margin-bottom:14px;}
.proj-tags{display:flex;flex-wrap:wrap;gap:5px;}
.ptag{background:rgba(167,139,250,.07);border:1px solid rgba(167,139,250,.13);color:var(--violet);font-size:.63rem;font-weight:600;padding:3px 9px;border-radius:4px;font-family:'JetBrains Mono',monospace;}
.proj-grid-small{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;}

/* rest of uploaded index intentionally omitted in this tool call */
</style>
</head>
<body></body>
</html>
